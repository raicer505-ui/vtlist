<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTList - Red de Colaboraciones Vtuber</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            900: '#1f1714',
                            800: '#2b221e',
                            700: '#3d312c',
                            600: '#5c4842',
                            500: '#8c6d62',
                            300: '#d7ccc8',
                            100: '#f5ebd6',
                        },
                        warm: {
                            orange: '#d97706',
                            amber: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-coffee-900 text-coffee-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- Navbar -->
    <header class="bg-coffee-800 border-b border-coffee-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="app.navigate('home')">
                <i class="fa-solid fa-mug-hot text-warm-amber text-2xl"></i>
                <span class="text-xl font-bold tracking-wider text-warm-amber">VT<span class="text-coffee-100">List</span></span>
            </div>
            <div class="flex items-center space-x-3" id="auth-nav-container">
                <button onclick="app.navigate('login')" class="bg-warm-orange hover:bg-amber-600 px-4 py-2 rounded-lg text-sm font-semibold text-white transition">
                    Iniciar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4" id="main-content">
        <!-- Se pinta inmediatamente -->
    </main>

    <!-- Footer -->
    <footer class="bg-coffee-800 border-t border-coffee-700 text-center py-4 text-xs text-coffee-300 mt-auto">
        <p>VTList &copy; 2026 - Conectando Vtubers de todo el mundo ☕✨</p>
    </footer>

    <!-- Modales Globales -->
    <div id="modal-container"></div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDyBoZpkiyT-rPA-Oejk1EWLChWOg1sly8",
          authDomain: "vtlist-dd805.firebaseapp.com",
          projectId: "vtlist-dd805",
          storageBucket: "vtlist-dd805.firebasestorage.app",
          messagingSenderId: "124697390551",
          appId: "1:124697390551:web:75e9751f97ed2d72fc6f92",
          measurementId: "G-2WBM1QW3R6"
        };

        let auth = null;
        let db = null;

        try {
            const firebaseApp = initializeApp(firebaseConfig);
            auth = getAuth(firebaseApp);
            db = getFirestore(firebaseApp);
        } catch (e) {
            console.error("Error Firebase:", e);
        }

        window.appState = {
            currentUser: null,
            userData: null,
            currentView: 'home',
            profiles: [
                { id: '1', name: 'BaltoDn', country: 'Argentina', avatarType: 'Humano', games: 'The Spirit and the Mouse, Mario Kart, Lethal Company', bio: 'Vtuber humano listo para colaborar y pasarla bien.', isAvailable: true, photoURL: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400' },
                { id: '2', name: '5hira', country: 'Argentina', avatarType: '2D', games: 'The Spirit and the Mouse, Valorant', bio: 'Streamer en colaboración continua.', isAvailable: true, photoURL: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400' }
            ],
            filter: { search: '', country: 'all', avatar: 'all', onlyCollab: false }
        };

        window.app = {
            navigate(view) {
                window.appState.currentView = view;
                render();
            }
        };

        // Renderizar de inmediato para evitar pantallas en blanco
        render();

        if (auth) {
            onAuthStateChanged(auth, async (user) => {
                window.appState.currentUser = user;
                if (user && db) {
                    try {
                        const userDoc = await getDoc(doc(db, 'users', user.uid));
                        if (userDoc.exists()) {
                            window.appState.userData = { id: userDoc.id, ...userDoc.data() };
                        }
                    } catch (err) {
                        console.error("Error cargando usuario:", err);
                    }
                }
                render();
            });
        }

        function render() {
            try {
                renderAuthNav();
                const main = document.getElementById('main-content');
                const view = window.appState.currentView;

                if (view === 'home') main.innerHTML = renderHome();
                else if (view === 'login') main.innerHTML = renderLogin();
                else if (view === 'register') main.innerHTML = renderRegister();
                else if (view === 'profile') main.innerHTML = renderProfileEditor();
            } catch (err) {
                console.error("Error render:", err);
            }
        }

        function renderAuthNav() {
            const container = document.getElementById('auth-nav-container');
            if (!container) return;
            const user = window.appState.currentUser;

            if (user) {
                container.innerHTML = `
                    <button onclick="app.navigate('profile')" class="bg-coffee-700 hover:bg-coffee-600 px-3 py-2 rounded-lg text-sm flex items-center space-x-2 transition"><i class="fa-solid fa-user-gear"></i><span class="hidden sm:inline">Perfil</span></button>
                    <button onclick="logout()" class="bg-red-900/60 hover:bg-red-800 px-3 py-2 rounded-lg text-sm transition"><i class="fa-solid fa-right-from-bracket"></i></button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="app.navigate('login')" class="bg-warm-orange hover:bg-amber-600 px-4 py-2 rounded-lg text-sm font-semibold text-white transition">Iniciar Sesión</button>
                `;
            }
        }

        function renderHome() {
            const state = window.appState;
            const filtered = state.profiles.filter(p => {
                const name = p.name || '';
                const games = p.games || '';
                const matchesSearch = name.toLowerCase().includes(state.filter.search.toLowerCase()) || games.toLowerCase().includes(state.filter.search.toLowerCase());
                const matchesCountry = state.filter.country === 'all' || p.country === state.filter.country;
                const matchesAvatar = state.filter.avatar === 'all' || p.avatarType === state.filter.avatar;
                const matchesCollab = !state.filter.onlyCollab || p.isAvailable;
                return matchesSearch && matchesCountry && matchesAvatar && matchesCollab;
            });

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-coffee-800 to-coffee-700 p-6 rounded-2xl border border-coffee-600 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 class="text-2xl md:text-3xl font-bold text-warm-amber mb-2">Encuentra Vtubers para Collab ☕</h1>
                            <p class="text-coffee-300 text-sm">Conecta con otros creadores, revisa juegos en común y pacta directos fácilmente.</p>
                        </div>
                        ${!state.currentUser ? `<button onclick="app.navigate('register')" class="bg-warm-orange hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition whitespace-nowrap">Crear mi perfil Vtuber</button>` : ''}
                    </div>

                    <div class="bg-coffee-800 p-4 rounded-xl border border-coffee-700 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-coffee-500"></i>
                            <input type="text" placeholder="Buscar nombre o juego..." value="${state.filter.search}" oninput="updateFilter('search', this.value)" class="w-full bg-coffee-900 border border-coffee-600 rounded-lg pl-10 pr-3 py-2 text-sm text-coffee-100 focus:outline-none focus:border-warm-orange">
                        </div>
                        <div>
                            <select onchange="updateFilter('country', this.value)" class="w-full bg-coffee-900 border border-coffee-600 rounded-lg px-3 py-2 text-sm text-coffee-100">
                                <option value="all">🌍 Todos los países</option>
                                <option value="Argentina" ${state.filter.country === 'Argentina' ? 'selected' : ''}>Argentina</option>
                                <option value="México" ${state.filter.country === 'México' ? 'selected' : ''}>México</option>
                                <option value="España" ${state.filter.country === 'España' ? 'selected' : ''}>España</option>
                            </select>
                        </div>
                        <div>
                            <select onchange="updateFilter('avatar', this.value)" class="w-full bg-coffee-900 border border-coffee-600 rounded-lg px-3 py-2 text-sm text-coffee-100">
                                <option value="all">🎭 Todos los avatares</option>
                                <option value="Humano" ${state.filter.avatar === 'Humano' ? 'selected' : ''}>Humano</option>
                                <option value="2D" ${state.filter.avatar === '2D' ? 'selected' : ''}>2D</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-center bg-coffee-900 border border-coffee-600 rounded-lg px-3 py-2">
                            <label class="flex items-center space-x-2 cursor-pointer text-sm">
                                <input type="checkbox" ${state.filter.onlyCollab ? 'checked' : ''} onchange="updateFilter('onlyCollab', this.checked)" class="w-4 h-4 text-warm-orange rounded">
                                <span class="text-warm-amber font-medium">✨ Solo disponibles</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${filtered.map(p => `
                            <div class="bg-coffee-800 border border-coffee-700 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
                                <div>
                                    <div class="h-24 bg-gradient-to-r from-coffee-600 to-coffee-700 relative">
                                        ${p.isAvailable ? '<span class="absolute top-2 right-2 bg-green-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">Disponible</span>' : ''}
                                    </div>
                                    <div class="px-5 -mt-10 flex items-end justify-between">
                                        <img src="${p.photoURL}" alt="${p.name}" class="w-20 h-20 rounded-full border-4 border-coffee-800 object-cover bg-coffee-700">
                                        <span class="text-xs bg-coffee-700 px-2.5 py-1 rounded-lg text-coffee-300">${p.country}</span>
                                    </div>
                                    <div class="p-5 space-y-3">
                                        <div>
                                            <h3 class="text-lg font-bold text-coffee-100">${p.name} <span class="text-xs font-normal bg-coffee-700 px-2 py-0.5 rounded text-warm-amber">${p.avatarType}</span></h3>
                                            <p class="text-xs text-coffee-400 mt-1">${p.bio}</p>
                                        </div>
                                        <div>
                                            <p class="text-xs font-semibold text-coffee-300 mb-1"><i class="fa-solid fa-gamepad mr-1 text-warm-amber"></i> Juegos:</p>
                                            <div class="flex flex-wrap gap-1">
                                                ${p.games.split(',').map(g => `<span class="text-[10px] bg-coffee-900 border border-coffee-700 px-2 py-0.5 rounded text-coffee-300">${g.trim()}</span>`).join('')}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="p-5 pt-0">
                                    <button onclick="alert('Inicia sesión para proponer una colaboración')" class="w-full bg-coffee-700 hover:bg-warm-orange text-coffee-100 hover:text-white font-semibold py-2 rounded-xl text-sm transition">Proponer Collab</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="max-w-md mx-auto bg-coffee-800 border border-coffee-700 p-8 rounded-2xl shadow-xl mt-10">
                    <h2 class="text-2xl font-bold text-warm-amber mb-6 text-center">Iniciar Sesión</h2>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div><label class="block text-xs font-semibold text-coffee-300 mb-1">Correo</label><input type="email" id="loginEmail" required class="w-full bg-coffee-900 border border-coffee-600 rounded-lg p-3 text-sm text-coffee-100"></div>
                        <div><label class="block text-xs font-semibold text-coffee-300 mb-1">Contraseña</label><input type="password" id="loginPassword" required class="w-full bg-coffee-900 border border-coffee-600 rounded-lg p-3 text-sm text-coffee-100"></div>
                        <button type="submit" class="w-full bg-warm-orange hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition">Entrar</button>
                    </form>
                    <p class="text-center text-xs text-coffee-400 mt-4"><a href="#" onclick="app.navigate('home')" class="text-warm-amber underline">Volver al inicio</a></p>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="max-w-md mx-auto bg-coffee-800 border border-coffee-700 p-8 rounded-2xl shadow-xl mt-10">
                    <h2 class="text-2xl font-bold text-warm-amber mb-6 text-center">Crear Cuenta</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-4">
                        <div><label class="block text-xs font-semibold text-coffee-300 mb-1">Correo</label><input type="email" id="regEmail" required class="w-full bg-coffee-900 border border-coffee-600 rounded-lg p-3 text-sm text-coffee-100"></div>
                        <div><label class="block text-xs font-semibold text-coffee-300 mb-1">Contraseña</label><input type="password" id="regPassword" required class="w-full bg-coffee-900 border border-coffee-600 rounded-lg p-3 text-sm text-coffee-100"></div>
                        <button type="submit" class="w-full bg-warm-orange hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition">Registrarse</button>
                    </form>
                    <p class="text-center text-xs text-coffee-400 mt-4"><a href="#" onclick="app.navigate('home')" class="text-warm-amber underline">Volver al inicio</a></p>
                </div>
            `;
        }

        function renderProfileEditor() {
            return `
                <div class="max-w-xl mx-auto bg-coffee-800 border border-coffee-700 p-8 rounded-2xl shadow-xl mt-6">
                    <h2 class="text-2xl font-bold text-warm-amber mb-6">Mi Perfil Vtuber</h2>
                    <button onclick="app.navigate('home')" class="bg-coffee-700 px-4 py-2 rounded-lg text-sm">Volver</button>
                </div>
            `;
        }

        window.updateFilter = function(key, value) {
            window.appState.filter[key] = value;
            render();
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            if(!auth) return;
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                app.navigate('home');
            } catch (err) { alert(err.message); }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            if(!auth) return;
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPassword').value);
                app.navigate('home');
            } catch (err) { alert(err.message); }
        };

        window.logout = function() {
            if(auth) signOut(auth).then(() => app.navigate('home'));
        };
    </script>
</body>
</html>
